<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Agent — Chat (demo)</title>
<style>
  :root { --bg: #f7f5f0; --ink: #1c1a17; --muted: #6b675f; --card: #fffdf9;
          --line: #ddd6c9; --green: #177245; --accent: #8a5a2b; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--ink); margin: 0; line-height: 1.5; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 90px; }
  header { margin: 8px 0 14px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  .status { font-size: 13px; color: var(--muted); }
  .status code { background: #f0ead9; padding: 1px 5px; border-radius: 4px;
                 font-size: 12px; word-break: break-all; }
  #transcript { display: flex; flex-direction: column; gap: 10px; }
  .msg { background: var(--card); border: 1px solid var(--line);
         border-radius: 12px; padding: 10px 14px; white-space: pre-wrap;
         word-wrap: break-word; font-size: 15px; }
  .msg.user { align-self: flex-end; background: #1c1a17; color: #fffdf9;
              border-color: #1c1a17; max-width: 85%; }
  .msg.agent { align-self: flex-start; max-width: 92%; }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .tools { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .proposal { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 10px;
              padding: 10px 12px; background: #fbf6ea; }
  .proposal p { margin: 0 0 8px; font-size: 14px; }
  .proposal .pid { font-family: monospace; font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  button { font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: #fff; cursor: pointer; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  #composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
              border-top: 1px solid var(--line); padding: 10px 14px; }
  #composer .wrap { display: flex; gap: 8px; padding: 0; margin: 0 auto; max-width: 720px; }
  #attach-chip { display: none; font-size: 13px; color: var(--muted); padding: 6px 2px 0; }
  #attach-chip button { font-size: 12px; padding: 2px 8px; margin-left: 8px; }
  #input { flex: 1; font-size: 15px; padding: 10px 12px; border-radius: 8px;
           border: 1px solid var(--line); }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #auth-block { margin: 10px 0 4px; font-size: 14px; }
  #auth-block input { font-size: 14px; padding: 8px 10px; border-radius: 8px;
                      border: 1px solid var(--line); margin: 0 6px 6px 0;
                      max-width: 220px; }
  #auth-block code { background: #f0ead9; padding: 1px 5px; border-radius: 4px;
                     font-size: 12px; }
  #auth-signedin { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Expense Agent — chat demo</h1>
    <div class="status" id="status">Connecting…</div>
    <div id="auth-block">
      <div id="auth-signedout">
        <input id="auth-email" type="email" autocomplete="email"
               placeholder="Email — same account as the Expense Tracker">
        <input id="auth-password" type="password" autocomplete="current-password"
               placeholder="Password">
        <button id="auth-signin" class="primary">Sign in</button>
        <div class="note">Sign in with the same account you use in the Expense Tracker
          app — the agent then reads and writes your real expenses.
          唔登入就繼續用示範資料。</div>
      </div>
      <div id="auth-signedin" hidden>
        <span>Signed in as <code id="auth-user-email"></code> — the agent is now
          using your Expense Tracker data. （已登入 — 助理會使用你的記帳資料。）</span>
        <button id="auth-signout">Sign out</button>
      </div>
    </div>
  </header>
  <div id="transcript" aria-live="polite"></div>
</div>
<div id="composer">
  <div class="wrap">
    <button id="attach" title="Attach a PDF — a statement or document for the agent to read">📎 PDF</button>
    <input id="pdf-file" type="file" accept=".pdf" hidden>
    <input id="input" type="text" autocomplete="off" enterkeyhint="send"
           placeholder="Ask about spending, e.g. How much did I spend on Transport in 2026-10?">
    <button id="send" class="primary">Send</button>
  </div>
  <div class="wrap"><div id="attach-chip"></div></div>
</div>

<script src="config.js"></script>
<script>
/*PDFPARSER-START*/
/* AlipayHK Transaction Statement parser — ported from the Expense
   Tracker importer (same grammar, same header-row + watermark rules).
   Pure over pdf.js positioned items: [{str, x, y}] per page. */
function parseAlipayHkItems(pages) {
  const MONTHS = { Jan: "01", Feb: "02", Mar: "03", Apr: "04", May: "05", Jun: "06", Jul: "07", Aug: "08", Sep: "09", Oct: "10", Nov: "11", Dec: "12" };

    const all = [];
    (pages || []).forEach((items) => (items || []).forEach((it) => all.push(it.str || "")));
    const joined = all.join(" ");
    if (!joined.includes("Transaction Statement") || !joined.includes("ALIPAY FINANCIAL SERVICES (HK)")) return null;
    let bands = null;
    for (const items of pages || []) {
      // The header is a ROW: all five labels share one y level. (The
      // summary block also prints "Transaction Type" as a lone label —
      // matching labels independently would pick that one and break
      // every band.)
      for (const d of items || []) {
        if (!(d.str || "").trim().startsWith("Transaction Date")) continue;
        const row = (items || []).filter((it) => Math.abs(it.y - d.y) <= 2);
        const at = (label) => row.find((it) => (it.str || "").trim().startsWith(label));
        const n = at("Transaction Number"), ty = at("Transaction Type"),
              m = at("Recipient / Merchant"), a = at("Transaction Amount");
        if (n && ty && m && a) { bands = { d: d.x, n: n.x, ty: ty.x, m: m.x, a: a.x, y: d.y }; break; }
      }
      if (bands) break;
    }
    if (!bands) return null;
    const bandOf = (x) => x < bands.n ? "date" : x < bands.ty ? "num" : x < bands.m ? "type" : x < bands.a ? "merchant" : "amount";
    const dateRe = /^(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{4})$/;
    const out = [];
    for (const items of pages || []) {
      const starts = (items || []).filter((it) => it.y < bands.y - 2 && bandOf(it.x) === "date" && dateRe.test((it.str || "").trim()));
      for (const st of starts) {
        const dm = (st.str || "").trim().match(dateRe);
        const rowItems = (items || []).filter((it) => it !== st && it.y <= st.y + 2 && it.y >= st.y - 16);
        const by = { num: [], type: [], merchant: [], amount: [] };
        for (const it of rowItems) {
          const b = bandOf(it.x);
          if (b in by) by[b].push(it);
        }
        const txm = by.num.map((i) => i.str).join(" ").match(/\d{16,}/);
        if (!txm) continue;
        const amtText = by.amount.sort((p, q) => p.x - q.x).map((i) => i.str).join(" ");
        const am = amtText.match(/([+\-])?\s*(HKD|CNY|USD|EUR|GBP|JPY|MOP)?\s*([\d,]+\.\d{2})/);
        if (!am) continue;
        const signed = (am[1] === "+" ? 1 : -1) * parseFloat(am[3].replace(/,/g, ""));
        if (!(signed < 0)) continue; // money in / zero: not an expense row
        const merchant = by.merchant.sort((p, q) => p.x - q.x).map((i) => (i.str || "").trim())
          .filter((x) => x && x !== "Confidential" && x !== "保密").join(" ").trim();
        const type = by.type.map((i) => (i.str || "").trim()).filter(Boolean).join(" ");
        out.push({
          amount: Math.abs(signed), currency: am[2] || "HKD", category: "Other", platform: "alipay",
          merchant, description: merchant,
          expense_date: dm[3] + "-" + MONTHS[dm[2]] + "-" + dm[1].padStart(2, "0"),
          external_id: "alipayhk:" + txm[0], source: "alipayhk_pdf",
          txtype: type,
        });
      }
    }
    return { platform: "alipay", expenses: out };
  
}
/*PDFPARSER-END*/
</script>
<script>
"use strict";
// Hosted version: the API base comes from config.js (set after deployment).
const API = String(window.AGENT_API || "").replace(/\/+$/, "");
const SUPABASE_URL = String(window.SUPABASE_URL || "").replace(/\/+$/, "");
const PUBKEY = String(window.SUPABASE_PUBLISHABLE_KEY || "");
const transcript = document.getElementById("transcript");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
let busy = false;

// ---- Sign-in ------------------------------------------------------------
// Same Supabase project and account as the Expense Tracker app (password
// grant with the publishable key, like the app's own sign-in). The access
// token is kept in sessionStorage (cleared when the tab closes); it goes
// out as Authorization: Bearer on /agent and /agent/confirm so the function
// can scope everything to this user's real Expense Tracker data.
// Signed out = demo mode, exactly as before.
const SESSION_KEY = "expense_agent_chat_session";

function getSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
    return s && s.access_token ? s : null;
  } catch { return null; }
}
function saveSession(s) { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession() { sessionStorage.removeItem(SESSION_KEY); }

function authHeader() {
  const s = getSession();
  return s ? { "Authorization": "Bearer " + s.access_token } : {};
}

// Called whenever the server says the token is no good (or sign-out):
// drop the session and send the user back to the sign-in form.
function handleAuthExpired() {
  clearSession();
  refreshAuthUI();
  addMessage("Your sign-in expired — please sign in again. 登入已過期，請重新登入。", "agent");
}

function refreshAuthUI() {
  const s = getSession();
  document.getElementById("auth-signedout").hidden = !!s;
  document.getElementById("auth-signedin").hidden = !s;
  if (s) document.getElementById("auth-user-email").textContent = s.email || "";
  updateStatusLine();
}

function updateStatusLine() {
  const s = getSession();
  fetch(API + "/agent/status").then(r => r.json()).then(st => {
    const model = "<code>" + esc(st.primary || "unknown") + "</code>";
    if (s) {
      statusEl.innerHTML = "Signed in as <code>" + esc(s.email || "") +
        "</code> — using your Expense Tracker data. Primary model: " + model;
    } else {
      statusEl.innerHTML = "Primary model: " + model +
        " · Demo on mock data — reads are instant, writes need your confirm.";
    }
  }).catch(() => {
    statusEl.textContent = "Status unavailable — is the server running?";
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function addMessage(text, kind) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.innerHTML = esc(text).replace(/\n/g, "<br>");
  transcript.appendChild(div);
  div.scrollIntoView({behavior: "smooth", block: "end"});
  return div;
}

// On load: show which model is currently primary (live from the server)
// plus whether the agent is on demo data or the signed-in user's data.
updateStatusLine();

async function postJSON(url, payload) {
  const r = await fetch(url, {
    method: "POST",
    headers: Object.assign({"Content-Type": "application/json"}, authHeader()),
    body: JSON.stringify(payload),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

// A pending proposal is ONLY executed when the human taps Confirm.
// Dismiss just hides the card; the agent never saves it.
function addProposalCard(agentMsgEl, pendingId) {
  const card = document.createElement("div");
  card.className = "proposal";
  card.innerHTML =
    "<p><strong>Pending proposal</strong> <span class='pid'>" + esc(pendingId) +
    "</span><br>This expense is <strong>not saved yet</strong>. Confirm to record it, " +
    "or dismiss to leave your data untouched.</p>" +
    "<div class='row'><button class='primary'>Confirm</button>" +
    "<button>Dismiss</button></div>";
  const [confirmBtn, dismissBtn] = card.querySelectorAll("button");
  confirmBtn.addEventListener("click", async () => {
    confirmBtn.disabled = dismissBtn.disabled = true;
    try {
      const res = await postJSON(API + "/agent/confirm", {action_id: pendingId});
      if (res.auth_expired) {
        handleAuthExpired();
      } else if (res.status === "ok" && res.record) {
        addMessage("Confirmed — recorded: " + res.record.description +
          ", $" + res.record.amount + " · " + res.record.category +
          " · " + res.record.date + " (id " + res.record.id + ")", "agent");
      } else {
        addMessage("Could not confirm: " + (res.reason || res.status), "agent");
      }
    } catch (e) {
      addMessage("Confirm failed: " + e.message, "agent");
    }
    card.remove();
  });
  dismissBtn.addEventListener("click", () => {
    addMessage("Dismissed — the proposal was not saved.", "agent");
    card.remove();
  });
  agentMsgEl.appendChild(card);
}

async function send() {
  const att = pendingAttachment;
  const text = input.value.trim() || (att ? "Please read and analyse the attached document." : "");
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = "";
  if (att) { pendingAttachment = null; renderAttachChip(); }
  addMessage(text + (att ? "\n📄 " + att.filename : ""), "user");
  const thinking = addMessage("thinking…", "thinking");
  try {
    const payload = {text};
    if (att) payload.attachment = att;
    const res = await postJSON(API + "/agent", payload);
    thinking.remove();
    if (res.auth_expired) {
      handleAuthExpired();
      busy = false; sendBtn.disabled = false; input.focus();
      return;
    }
    const agentEl = addMessage(res.answer || "(no answer)", "agent");
    if (res.calls && res.calls.length) {
      const t = document.createElement("div");
      t.className = "tools";
      t.textContent = "tools: " + res.calls.map(c =>
        (c.tool || "?") + " → " + (c.outcome || "?")).join(", ");
      agentEl.appendChild(t);
    }
    (res.pending_ids || []).forEach(id => addProposalCard(agentEl, id));
    if (res.failed) addMessage("The agent could not complete that request.", "agent");
  } catch (e) {
    thinking.remove();
    addMessage("Error: " + e.message, "agent");
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

/* ---- PDF attach: read on this device, never uploaded as a file ----
   pdf.js is lazy-loaded (pinned) only when a PDF is picked. AlipayHK
   statements are parsed into rows on-device; any other PDF is sent as
   extracted text. The agent's computed totals are made server-side. */
let pendingAttachment = null;

async function ensurePdfJs() {
  if (window.__pdfjsLib && window.__pdfjsLib.getDocument) return window.__pdfjsLib;
  const lib = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.min.mjs");
  lib.GlobalWorkerOptions.workerSrc =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.worker.min.mjs";
  // Without the CMap pack, pdf.js silently drops CJK glyphs (Chinese
  // merchant names would vanish). Pinned, same version.
  window.__pdfjsOptions = {
    cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/cmaps/",
    cMapPacked: true,
    standardFontDataUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/standard_fonts/",
  };
  window.__pdfjsLib = lib;
  return lib;
}

function renderAttachChip() {
  const chip = document.getElementById("attach-chip");
  if (!pendingAttachment) { chip.style.display = "none"; chip.innerHTML = ""; return; }
  chip.style.display = "block";
  chip.textContent = "📄 " + pendingAttachment.filename + " — " + (pendingAttachment._summary || "ready");
  const x = document.createElement("button");
  x.textContent = "✕ Remove";
  x.addEventListener("click", () => { pendingAttachment = null; renderAttachChip(); });
  chip.appendChild(x);
}

async function readPdfFile(file) {
  const lib = await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument(Object.assign({}, window.__pdfjsOptions || {}, { data: new Uint8Array(buf) })).promise;
  const pages = [];
  let textAll = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const items = (tc.items || []).map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }));
    pages.push(items);
    textAll += items.map(i => i.str).join(" ") + "\n";
  }
  const stmt = parseAlipayHkItems(pages);
  if (stmt && stmt.expenses.length) {
    const rows = stmt.expenses.map(r => ({ date: r.expense_date, merchant: r.merchant, amount: r.amount, currency: r.currency, type: r.txtype || "" }));
    const total = rows.reduce((a, r) => a + r.amount, 0);
    return { kind: "alipayhk_statement", filename: file.name, rows,
             _summary: rows.length + " transactions · " + rows[0].currency + " " + total.toFixed(2) };
  }
  return { kind: "pdf_text", filename: file.name, text: textAll.slice(0, 8000),
           _summary: "document text (" + pdf.numPages + " page" + (pdf.numPages > 1 ? "s" : "") + ")" };
}

const attachBtn = document.getElementById("attach");
const pdfFileInput = document.getElementById("pdf-file");
attachBtn.addEventListener("click", () => pdfFileInput.click());
pdfFileInput.addEventListener("change", async () => {
  const file = pdfFileInput.files[0];
  pdfFileInput.value = "";
  if (!file) return;
  const chip = document.getElementById("attach-chip");
  chip.style.display = "block";
  chip.textContent = "Reading " + file.name + " on this device…";
  try {
    pendingAttachment = await readPdfFile(file);
    renderAttachChip();
  } catch (e) {
    pendingAttachment = null;
    renderAttachChip();
    addMessage("Could not read that PDF: " + e.message, "agent");
  }
});

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

async function doSignIn() {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if (!email || !password) {
    addMessage("Enter your email and password first. 請先輸入電郵同密碼。", "agent");
    return;
  }
  const btn = document.getElementById("auth-signin");
  btn.disabled = true;
  try {
    const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "apikey": PUBKEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error_description || data.msg || "Sign-in failed");
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      email: (data.user && data.user.email) || email,
      user_id: data.user && data.user.id,
      expires_at: data.expires_at,
    });
    document.getElementById("auth-password").value = "";
    refreshAuthUI();
    addMessage("Signed in as " + email + " — ask me about YOUR expenses now. " +
      "已登入 — 而家可以直接問你嘅記帳。Any new expense still stays a proposal until you tap Confirm.", "agent");
  } catch (e) {
    addMessage("Sign-in failed: " + e.message, "agent");
  }
  btn.disabled = false;
}

async function doSignOut() {
  // Best-effort server-side logout; the local session is dropped regardless.
  const s = getSession();
  try {
    if (s) {
      await fetch(SUPABASE_URL + "/auth/v1/logout", {
        method: "POST",
        headers: { "apikey": PUBKEY, "Authorization": "Bearer " + s.access_token },
      });
    }
  } catch { /* local session is dropped regardless */ }
  clearSession();
  refreshAuthUI();
  addMessage("Signed out — the agent is back on demo data. 已登出 — 助理返返去示範模式。", "agent");
}

document.getElementById("auth-signin").addEventListener("click", doSignIn);
document.getElementById("auth-password").addEventListener("keydown",
  e => { if (e.key === "Enter") doSignIn(); });
document.getElementById("auth-signout").addEventListener("click", doSignOut);

refreshAuthUI();
if (!getSession()) {
  addMessage("Hi — ask me about the demo expenses (in English or 中文）, or tell me to record one. " +
    "Any new expense stays a proposal until you tap Confirm.", "agent");
}
input.focus();
</script>
</body>
</html>
