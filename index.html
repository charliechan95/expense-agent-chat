<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Agent — Chat (demo)</title>
<style>
  :root { --bg: #f7f5f0; --ink: #1c1a17; --muted: #6b675f; --card: #fffdf9;
          --line: #ddd6c9; --green: #177245; --accent: #8a5a2b; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--ink); margin: 0; line-height: 1.5; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 90px; }
  header { margin: 8px 0 14px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  .status { font-size: 13px; color: var(--muted); }
  .status code { background: #f0ead9; padding: 1px 5px; border-radius: 4px;
                 font-size: 12px; word-break: break-all; }
  #transcript { display: flex; flex-direction: column; gap: 10px; }
  .msg { background: var(--card); border: 1px solid var(--line);
         border-radius: 12px; padding: 10px 14px; white-space: pre-wrap;
         word-wrap: break-word; font-size: 15px; }
  .msg.user { align-self: flex-end; background: #1c1a17; color: #fffdf9;
              border-color: #1c1a17; max-width: 85%; }
  .msg.agent { align-self: flex-start; max-width: 92%; }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .tools { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .proposal { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 10px;
              padding: 10px 12px; background: #fbf6ea; }
  .proposal p { margin: 0 0 8px; font-size: 14px; }
  .proposal .pid { font-family: monospace; font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  button { font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: #fff; cursor: pointer; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  #composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
              border-top: 1px solid var(--line); padding: 10px 14px; }
  #composer .wrap { display: flex; gap: 8px; padding: 0; margin: 0 auto; max-width: 720px; }
  #input { flex: 1; font-size: 15px; padding: 10px 12px; border-radius: 8px;
           border: 1px solid var(--line); }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #auth-block { margin: 10px 0 4px; font-size: 14px; }
  #auth-block input { font-size: 14px; padding: 8px 10px; border-radius: 8px;
                      border: 1px solid var(--line); margin: 0 6px 6px 0;
                      max-width: 220px; }
  #auth-block code { background: #f0ead9; padding: 1px 5px; border-radius: 4px;
                     font-size: 12px; }
  #auth-signedin { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Expense Agent — chat demo</h1>
    <div class="status" id="status">Connecting…</div>
    <div id="auth-block">
      <div id="auth-signedout">
        <input id="auth-email" type="email" autocomplete="email"
               placeholder="Email — same account as the Expense Tracker">
        <input id="auth-password" type="password" autocomplete="current-password"
               placeholder="Password">
        <button id="auth-signin" class="primary">Sign in</button>
        <div class="note">Sign in with the same account you use in the Expense Tracker
          app — the agent then reads and writes your real expenses.
          唔登入就繼續用示範資料。</div>
      </div>
      <div id="auth-signedin" hidden>
        <span>Signed in as <code id="auth-user-email"></code> — the agent is now
          using your Expense Tracker data. （已登入 — 助理會使用你的記帳資料。）</span>
        <button id="auth-signout">Sign out</button>
      </div>
    </div>
  </header>
  <div id="transcript" aria-live="polite"></div>
</div>
<div id="composer">
  <div class="wrap">
    <input id="input" type="text" autocomplete="off" enterkeyhint="send"
           placeholder="Ask about spending, e.g. How much did I spend on Transport in 2026-10?">
    <button id="send" class="primary">Send</button>
  </div>
</div>

<script src="config.js"></script>
<script>
"use strict";
// Hosted version: the API base comes from config.js (set after deployment).
const API = String(window.AGENT_API || "").replace(/\/+$/, "");
const SUPABASE_URL = String(window.SUPABASE_URL || "").replace(/\/+$/, "");
const PUBKEY = String(window.SUPABASE_PUBLISHABLE_KEY || "");
const transcript = document.getElementById("transcript");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
let busy = false;

// ---- Sign-in ------------------------------------------------------------
// Same Supabase project and account as the Expense Tracker app (password
// grant with the publishable key, like the app's own sign-in). The access
// token is kept in sessionStorage (cleared when the tab closes); it goes
// out as Authorization: Bearer on /agent and /agent/confirm so the function
// can scope everything to this user's real Expense Tracker data.
// Signed out = demo mode, exactly as before.
const SESSION_KEY = "expense_agent_chat_session";

function getSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
    return s && s.access_token ? s : null;
  } catch { return null; }
}
function saveSession(s) { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession() { sessionStorage.removeItem(SESSION_KEY); }

function authHeader() {
  const s = getSession();
  return s ? { "Authorization": "Bearer " + s.access_token } : {};
}

// Called whenever the server says the token is no good (or sign-out):
// drop the session and send the user back to the sign-in form.
function handleAuthExpired() {
  clearSession();
  refreshAuthUI();
  addMessage("Your sign-in expired — please sign in again. 登入已過期，請重新登入。", "agent");
}

function refreshAuthUI() {
  const s = getSession();
  document.getElementById("auth-signedout").hidden = !!s;
  document.getElementById("auth-signedin").hidden = !s;
  if (s) document.getElementById("auth-user-email").textContent = s.email || "";
  updateStatusLine();
}

function updateStatusLine() {
  const s = getSession();
  fetch(API + "/agent/status").then(r => r.json()).then(st => {
    const model = "<code>" + esc(st.primary || "unknown") + "</code>";
    if (s) {
      statusEl.innerHTML = "Signed in as <code>" + esc(s.email || "") +
        "</code> — using your Expense Tracker data. Primary model: " + model;
    } else {
      statusEl.innerHTML = "Primary model: " + model +
        " · Demo on mock data — reads are instant, writes need your confirm.";
    }
  }).catch(() => {
    statusEl.textContent = "Status unavailable — is the server running?";
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function addMessage(text, kind) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.innerHTML = esc(text).replace(/\n/g, "<br>");
  transcript.appendChild(div);
  div.scrollIntoView({behavior: "smooth", block: "end"});
  return div;
}

// On load: show which model is currently primary (live from the server)
// plus whether the agent is on demo data or the signed-in user's data.
updateStatusLine();

async function postJSON(url, payload) {
  const r = await fetch(url, {
    method: "POST",
    headers: Object.assign({"Content-Type": "application/json"}, authHeader()),
    body: JSON.stringify(payload),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

// A pending proposal is ONLY executed when the human taps Confirm.
// Dismiss just hides the card; the agent never saves it.
function addProposalCard(agentMsgEl, pendingId) {
  const card = document.createElement("div");
  card.className = "proposal";
  card.innerHTML =
    "<p><strong>Pending proposal</strong> <span class='pid'>" + esc(pendingId) +
    "</span><br>This expense is <strong>not saved yet</strong>. Confirm to record it, " +
    "or dismiss to leave your data untouched.</p>" +
    "<div class='row'><button class='primary'>Confirm</button>" +
    "<button>Dismiss</button></div>";
  const [confirmBtn, dismissBtn] = card.querySelectorAll("button");
  confirmBtn.addEventListener("click", async () => {
    confirmBtn.disabled = dismissBtn.disabled = true;
    try {
      const res = await postJSON(API + "/agent/confirm", {action_id: pendingId});
      if (res.auth_expired) {
        handleAuthExpired();
      } else if (res.status === "ok" && res.record) {
        addMessage("Confirmed — recorded: " + res.record.description +
          ", $" + res.record.amount + " · " + res.record.category +
          " · " + res.record.date + " (id " + res.record.id + ")", "agent");
      } else {
        addMessage("Could not confirm: " + (res.reason || res.status), "agent");
      }
    } catch (e) {
      addMessage("Confirm failed: " + e.message, "agent");
    }
    card.remove();
  });
  dismissBtn.addEventListener("click", () => {
    addMessage("Dismissed — the proposal was not saved.", "agent");
    card.remove();
  });
  agentMsgEl.appendChild(card);
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = "";
  addMessage(text, "user");
  const thinking = addMessage("thinking…", "thinking");
  try {
    const res = await postJSON(API + "/agent", {text});
    thinking.remove();
    if (res.auth_expired) {
      handleAuthExpired();
      busy = false; sendBtn.disabled = false; input.focus();
      return;
    }
    const agentEl = addMessage(res.answer || "(no answer)", "agent");
    if (res.calls && res.calls.length) {
      const t = document.createElement("div");
      t.className = "tools";
      t.textContent = "tools: " + res.calls.map(c =>
        (c.tool || "?") + " → " + (c.outcome || "?")).join(", ");
      agentEl.appendChild(t);
    }
    (res.pending_ids || []).forEach(id => addProposalCard(agentEl, id));
    if (res.failed) addMessage("The agent could not complete that request.", "agent");
  } catch (e) {
    thinking.remove();
    addMessage("Error: " + e.message, "agent");
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

async function doSignIn() {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if (!email || !password) {
    addMessage("Enter your email and password first. 請先輸入電郵同密碼。", "agent");
    return;
  }
  const btn = document.getElementById("auth-signin");
  btn.disabled = true;
  try {
    const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "apikey": PUBKEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error_description || data.msg || "Sign-in failed");
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      email: (data.user && data.user.email) || email,
      user_id: data.user && data.user.id,
      expires_at: data.expires_at,
    });
    document.getElementById("auth-password").value = "";
    refreshAuthUI();
    addMessage("Signed in as " + email + " — ask me about YOUR expenses now. " +
      "已登入 — 而家可以直接問你嘅記帳。Any new expense still stays a proposal until you tap Confirm.", "agent");
  } catch (e) {
    addMessage("Sign-in failed: " + e.message, "agent");
  }
  btn.disabled = false;
}

async function doSignOut() {
  // Best-effort server-side logout; the local session is dropped regardless.
  const s = getSession();
  try {
    if (s) {
      await fetch(SUPABASE_URL + "/auth/v1/logout", {
        method: "POST",
        headers: { "apikey": PUBKEY, "Authorization": "Bearer " + s.access_token },
      });
    }
  } catch { /* local session is dropped regardless */ }
  clearSession();
  refreshAuthUI();
  addMessage("Signed out — the agent is back on demo data. 已登出 — 助理返返去示範模式。", "agent");
}

document.getElementById("auth-signin").addEventListener("click", doSignIn);
document.getElementById("auth-password").addEventListener("keydown",
  e => { if (e.key === "Enter") doSignIn(); });
document.getElementById("auth-signout").addEventListener("click", doSignOut);

refreshAuthUI();
if (!getSession()) {
  addMessage("Hi — ask me about the demo expenses (in English or 中文）, or tell me to record one. " +
    "Any new expense stays a proposal until you tap Confirm.", "agent");
}
input.focus();
</script>
</body>
</html>
